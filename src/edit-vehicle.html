<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>マシン追加</title>
</head>

<body x-data="{
  page: 'character',
  loaded: true,
  darkMode: false,
  stickyMenu: false,
  sidebarToggle: false,
  scrollTop: false,
  character: null,
  mkCharacters: [],
  vehicle: null,
  mkVehicles: [],
  combined: null,
  characterStats: null,
  vehicleStats: null,
  form: {
    name: '',
    name_ja: '',
    specialty: '',
    description: '',
    image: '',
    on_road_speed: 0,
    off_road_speed: 0,
    water_speed: 0,
    acceleration: 0,
    mini_turbo: 0,
    weight: 0,
    coin_curve: 0,
    on_road_handling: 0,
    off_road_handling: 0,
    water_handling: 0,
    invincibility: 0,
  },
  save() {
    const vehicles = JSON.parse(localStorage.getItem('mk_vehicles') || '[]');
    const index = vehicles.findIndex(v => v.name === this.form.name);
  if (index !== -1) {
    vehicles[index] = this.form;
  }
    localStorage.setItem('mk_vehicles', JSON.stringify(vehicles));
    window.location.href = 'index.html';
  }
}" x-init="
  mkCharacters = JSON.parse(localStorage.getItem('mk_characters') || '[]');
  mkVehicles = JSON.parse(localStorage.getItem('mk_vehicles') || '[]');
  const params = new URLSearchParams(window.location.search);
  const name = params.get('name');
  const vehicles = mkVehicles.find(c => c.name === name) ?? null;
  if (vehicles) form = { ...vehicles };
" :class="{'dark bg-gray-900': darkMode === true}">

  <include src="./partials/preloader.html" />
  <div class="flex h-screen overflow-hidden">
    <include src="./partials/sidebar.html" />
    <div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">
      <include src="./partials/overlay.html" />
      <include src="./partials/header.html" />

      <main>
        <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
          <div class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
            <h3 class="mb-6 text-lg font-semibold text-gray-800 dark:text-white">マシン編集</h3>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <div class="md:col-span-2">
                <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400">画像</label>
                <!-- 既存画像のプレビュー -->
                <img :src="form.image || `./images/vehicle/${form.name}.webp`"
                  class="mb-2 h-24 w-24 object-contain rounded-xl" />
                <label
                  class="flex items-center gap-3 cursor-pointer rounded-lg border border-gray-200 px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-gray-800">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                  </svg>
                  <span x-text="form.image ? '画像を変更' : '画像を選択'"></span>
                  <input type="file" accept="image/*" class="hidden" @change="
        const file = $event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => form.image = e.target.result;
          reader.readAsDataURL(file);
        }
      " />
                </label>
              </div>
              <!-- name -->
              <div>
                <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400">ID（英語・スネークケース）</label>
                <input type="text" x-model="form.name" disabled
                  class="w-full rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-800 dark:bg-gray-900 dark:text-white"
                  placeholder="mario" />
              </div>

              <!-- name_ja -->
              <div>
                <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400">名前（日本語）</label>
                <input type="text" x-model="form.name_ja" disabled
                  class="w-full rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-800 dark:bg-gray-900 dark:text-white"
                  placeholder="マリオ" />
              </div>

              <!-- specialty -->
              <div>
                <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400">得意地形</label>
                <select x-model="form.specialty"
                  class="w-full rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-800 dark:bg-gray-900 dark:text-white">
                  <option value="">なし</option>
                  <option value="on_road">舗装路</option>
                  <option value="off_road">悪路</option>
                  <option value="water">水上</option>
                </select>
              </div>

              <!-- description -->
              <div class="md:col-span-2">
                <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400">説明</label>
                <textarea x-model="form.description" rows="3"
                  class="w-full rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-800 dark:bg-gray-900 dark:text-white"></textarea>
              </div>

              <!-- ステータス -->
              <template x-for="[key, label] in [
                ['on_road_speed', 'スピード（舗装路）'],
                ['off_road_speed', 'スピード（悪路）'],
                ['water_speed', 'スピード（水上）'],
                ['acceleration', '加速度'],
                ['mini_turbo', 'ミニターボの加速度'],
                ['weight', '重さ'],
                ['coin_curve', 'コイン増の加速度'],
                ['on_road_handling', 'まがりやすさ（舗装路）'],
                ['off_road_handling', 'まがりやすさ（悪路）'],
                ['water_handling', 'まがりやすさ（水上）'],
                ['invincibility', '無敵の時のスピード'],
              ]" :key="key">
                <div>
                  <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400" x-text="label"></label>
                  <input type="number" min="0" max="13" x-model.number="form[key]"
                    class="w-full rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-800 dark:bg-gray-900 dark:text-white" />
                </div>
              </template>
            </div>

            <!-- ボタン -->
            <div class="mt-6 flex gap-3">
              <button @click="save()" class="rounded-lg bg-brand-500 px-6 py-2 text-white hover:bg-brand-600">
                保存
              </button>
              <a href="index.html"
                class="rounded-lg border border-gray-200 px-6 py-2 text-gray-600 hover:bg-gray-50 dark:border-gray-800 dark:text-gray-400">
                キャンセル
              </a>
            </div>

          </div>
        </div>
      </main>
    </div>
  </div>
</body>

</html>
