<!doctype html>
<html lang="ja">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>キャラクター追加</title>
<link rel="icon" href="favicon.ico"><link href="style.css" rel="stylesheet"></head>

<body x-data="{
  page: 'character',
  loaded: true,
  darkMode: false,
  stickyMenu: false,
  sidebarToggle: false,
  scrollTop: false,
  character: null,
  mkCharacters: [],
  vehicle: null,
  mkVehicles: [],
  combined: null,
  characterStats: null,
  vehicleStats: null,
  form: {
    name: '',
    name_ja: '',
    specialty: '',
    description: '',
    image: '',
    on_road_speed: 0,
    off_road_speed: 0,
    water_speed: 0,
    acceleration: 0,
    mini_turbo: 0,
    weight: 0,
    coin_curve: 0,
    on_road_handling: 0,
    off_road_handling: 0,
    water_handling: 0,
    invincibility: 0,
  },
  save() {
    const characters = JSON.parse(localStorage.getItem('mk_characters') || '[]');
    characters.push(this.form);
    localStorage.setItem('mk_characters', JSON.stringify(characters));
    window.location.href = 'index.html';
  }
}" :class="{'dark bg-gray-900': darkMode === true}">

  <div
  x-show="loaded"
  x-init="window.addEventListener('DOMContentLoaded', () => {setTimeout(() => loaded = false, 500)})"
  class="fixed left-0 top-0 z-999999 flex h-screen w-screen items-center justify-center bg-white dark:bg-black"
>
  <div
    class="h-16 w-16 animate-spin rounded-full border-4 border-solid border-brand-500 border-t-transparent"
  ></div>
</div>
<div class="flex h-screen overflow-hidden">
    <aside :class="sidebarToggle ? 'translate-x-0 lg:w-[90px]' : '-translate-x-full'"
  class="sidebar fixed left-0 top-0 z-9999 flex h-screen w-[290px] flex-col overflow-y-hidden border-r border-gray-200 bg-white px-5 dark:border-gray-800 dark:bg-black lg:static lg:translate-x-0">
  <!-- SIDEBAR HEADER -->
  <div :class="sidebarToggle ? 'justify-center' : 'justify-between'"
    class="flex items-center gap-2 pt-8 sidebar-header pb-7">
    <a href="index.html">
      <span class="logo" :class="sidebarToggle ? 'hidden' : ''">
        <img class="dark:hidden" src="images/logo.svg" alt="Logo" />
        <img class="hidden dark:block" src="images/logo-dark.svg" alt="Logo" />
      </span>

      <img class="logo-icon" :class="sidebarToggle ? 'lg:block' : 'hidden'" src="images/logo-icon.svg"
        alt="Logo" />
    </a>
  </div>
  <!-- SIDEBAR HEADER -->

  <div class="flex flex-col overflow-y-auto duration-300 ease-linear no-scrollbar">
    <!-- Sidebar Menu -->
    <nav x-data="{selected: 'character'}">
      <!-- Menu Group -->
      <div>
        <h3 class="mb-4 text-xs uppercase leading-[20px] text-gray-400">
          <span class="menu-group-title" :class="sidebarToggle ? 'lg:hidden' : ''">
            MENU
          </span>

          <svg :class="sidebarToggle ? 'lg:block hidden' : 'hidden'" class="mx-auto fill-current menu-group-icon"
            width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fill-rule="evenodd" clip-rule="evenodd"
              d="M5.99915 10.2451C6.96564 10.2451 7.74915 11.0286 7.74915 11.9951V12.0051C7.74915 12.9716 6.96564 13.7551 5.99915 13.7551C5.03265 13.7551 4.24915 12.9716 4.24915 12.0051V11.9951C4.24915 11.0286 5.03265 10.2451 5.99915 10.2451ZM17.9991 10.2451C18.9656 10.2451 19.7491 11.0286 19.7491 11.9951V12.0051C19.7491 12.9716 18.9656 13.7551 17.9991 13.7551C17.0326 13.7551 16.2491 12.9716 16.2491 12.0051V11.9951C16.2491 11.0286 17.0326 10.2451 17.9991 10.2451ZM13.7491 11.9951C13.7491 11.0286 12.9656 10.2451 11.9991 10.2451C11.0326 10.2451 10.2491 11.0286 10.2491 11.9951V12.0051C10.2491 12.9716 11.0326 13.7551 11.9991 13.7551C12.9656 13.7551 13.7491 12.9716 13.7491 12.0051V11.9951Z"
              fill="" />
          </svg>
        </h3>

        <ul class="flex flex-col gap-4 mb-6">

          <!-- キャラクター親メニュー -->
          <li>
            <a href="#" @click.prevent="selected = (selected === 'character' ? '' : 'character');
            page = 'character';
            characterStats = convertStatsHalf(character);
            $nextTick(() => setTimeout(() => chart01(character.name), 50))
            " class="menu-item group" :class=" (selected === 'character') ? 'menu-item-active' : 'menu-item-inactive'">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-users-icon lucide-users">
                <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2" />
                <path d="M16 3.128a4 4 0 0 1 0 7.744" />
                <path d="M22 21v-2a4 4 0 0 0-3-3.87" />
                <circle cx="9" cy="7" r="4" />
              </svg>
              <span class="menu-item-text" :class="sidebarToggle ? 'lg:hidden' : ''">
                キャラクター
              </span>
              <svg class="menu-item-arrow"
                :class="[(selected === 'character') ? 'menu-item-arrow-active' : 'menu-item-arrow-inactive', sidebarToggle ? 'lg:hidden' : '' ]"
                width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4.79175 7.39584L10.0001 12.6042L15.2084 7.39585" stroke="" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <!-- Dropdown Menu Start -->
            <div class="overflow-hidden transform translate" :class="(selected === 'character') ? 'block' :'hidden'">
              <ul :class="sidebarToggle ? 'lg:hidden' : 'flex'" class="flex flex-col gap-1 mt-2 menu-dropdown pl-9">
                <template x-for="c in mkCharacters" :key="c.name">
                  <li>
                    <a href="#" @click.prevent="
                      page = 'character';
                      character = mkCharacters.find(ch=> ch.name === c.name);
                      characterStats = convertStatsHalf(character);
                      $nextTick(() => chart01(c.name))
                      " class="menu-dropdown-item group"
                      :class="character?.name === c.name ? 'menu-dropdown-item-active' : 'menu-dropdown-item-inactive'">
                      <span x-text="c.name_ja"></span>
                    </a>
                  </li>
                </template>

                <!-- 追加ボタン -->
                <li>
                  <a href="add-character.html" class="menu-dropdown-item group menu-dropdown-item-inactive">
                    ＋ キャラクター追加
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- マシン親メニュー -->
          <li>
            <a href="#" @click.prevent="selected = (selected === 'vehicle' ? '' : 'vehicle');
              page = 'vehicle';
              vehicleStats = convertStatsHalf(vehicle);
              $nextTick(() => setTimeout(() => chart02(vehicle.name), 50))
             " class="menu-item group" :class="(selected === 'vehicle') ? 'menu-item-active' : 'menu-item-inactive'">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-car-icon lucide-car">
                <path
                  d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 10.6 16 10 16 10s-1.3-1.4-2.2-2.3c-.5-.4-1.1-.7-1.8-.7H5c-.6 0-1.1.4-1.4.9l-1.4 2.9A3.7 3.7 0 0 0 2 12v4c0 .6.4 1 1 1h2" />
                <circle cx="7" cy="17" r="2" />
                <path d="M9 17h6" />
                <circle cx="17" cy="17" r="2" />
              </svg>
              <span class="menu-item-text" :class="sidebarToggle ? 'lg:hidden' : ''">
                マシン
              </span>
              <svg class="menu-item-arrow absolute right-2.5 top-1/2 -translate-y-1/2 stroke-current"
                :class="[(selected === 'vehicle') ? 'menu-item-arrow-active' : 'menu-item-arrow-inactive', sidebarToggle ? 'lg:hidden' : '' ]"
                width="20" height="20" viewBox="0 0 20 20" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M4.79175 7.39584L10.0001 12.6042L15.2084 7.39585" stroke="" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round" />
              </svg>
            </a>
            <!-- Dropdown Menu Start -->
            <div class="overflow-hidden transform translate" :class="(selected === 'vehicle') ? 'block' :'hidden'">
              <ul :class="sidebarToggle ? 'lg:hidden' : 'flex'" class="flex flex-col gap-1 mt-2 menu-dropdown pl-9">
                <template x-for="v in mkVehicles" :key="v.name">
                  <li>
                    <a href="#" @click.prevent="
                      page = 'vehicle';
                      vehicle = mkVehicles.find(vh => vh.name === v.name);
                      vehicleStats = convertStatsHalf(vehicle);
                      $nextTick(() => setTimeout(() => chart02(v.name), 50))
                    " class="menu-dropdown-item group"
                      :class="vehicle?.name === v.name ? 'menu-dropdown-item-active' : 'menu-dropdown-item-inactive'">
                      <span x-text="v.name_ja"></span>
                    </a>
                  </li>
                </template>

                <!-- 追加ボタン -->
                <li>
                  <a href="add-vehicle.html" class="menu-dropdown-item group menu-dropdown-item-inactive">
                    ＋ マシン追加
                  </a>
                </li>
              </ul>
            </div>
          </li>

          <!-- 組み合わせ -->
          <li>
            <a href="#" @click.prevent="
              selected = (selected === 'combine' ? '' : 'combine');
              page = 'combine';
              combined = calcCombined(character, vehicle);
              $nextTick(() => setTimeout(() => chart03(combined), 50))
            " class="menu-item group" :class="(selected === 'combine') ? 'menu-item-active' : 'menu-item-inactive'">
              <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                class="lucide lucide-wrench-icon lucide-wrench">
                <path
                  d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.106-3.105c.32-.322.863-.22.983.218a6 6 0 0 1-8.259 7.057l-7.91 7.91a1 1 0 0 1-2.999-3l7.91-7.91a6 6 0 0 1 7.057-8.259c.438.12.54.662.219.984z" />
              </svg>
              <span class="menu-item-text" :class="sidebarToggle ? 'lg:hidden' : ''">
                組み合わせ
              </span>
            </a>
          </li>

        </ul>
      </div>

    </nav>
    <!-- Sidebar Menu -->

  </div>
</aside><div class="relative flex flex-col flex-1 overflow-x-hidden overflow-y-auto">

  @click="sidebarToggle = false"
  :class="sidebarToggle ? 'block lg:hidden' : 'hidden'"
  class="fixed w-full h-screen z-9 bg-gray-900/50"
></div>

          <path fill-rule="evenodd" clip-rule="evenodd"

        </svg>

        <!-- cross icon -->
        <svg :class="sidebarToggle ? 'block lg:hidden' : 'hidden'" class="fill-current" width="24" height="24"
          viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" clip-rule="evenodd"
            d="M6.21967 7.28131C5.92678 6.98841 5.92678 6.51354 6.21967 6.22065C6.51256 5.92775 6.98744 5.92775 7.28033 6.22065L11.999 10.9393L16.7176 6.22078C17.0105 5.92789 17.4854 5.92788 17.7782 6.22078C18.0711 6.51367 18.0711 6.98855 17.7782 7.28144L13.0597 12L17.7782 16.7186C18.0711 17.0115 18.0711 17.4863 17.7782 17.7792C17.4854 18.0721 17.0105 18.0721 16.7176 17.7792L11.999 13.0607L7.28033 17.7794C6.98744 18.0722 6.51256 18.0722 6.21967 17.7794C5.92678 17.4865 5.92678 17.0116 6.21967 16.7187L10.9384 12L6.21967 7.28131Z"

        </svg>
      </button>
      <!-- Hamburger Toggle BTN -->

      <a href="index.html" class="lg:hidden">
        <img class="dark:hidden" src="images/logo.svg" alt="Logo" />
        <img class="hidden dark:block" src="images/logo-dark.svg" alt="Logo" />
      </a>

      <!-- Application nav menu button -->

      <div class="2xsm:gap-3 flex items-center gap-2">

 4.29224 10.0001ZM4.9029 5.9637C5.1958 6.25659 5.67067 6.25659 5.96356 5.9637C6.25646 5.6708 6.25646 5.19593 5.96356 4.90303L5.07968 4.01915C4.78679 3.72626 4.31191 3.72626 4.01902 4.01915C3.72613 4.31204 3.72613 4.78692 4.01902 5.07981L4.9029 5.9637Z"

              d="M17.4547 11.97L18.1799 12.1611C18.265 11.8383 18.1265 11.4982 17.8401 11.3266C17.5538 11.1551 17.1885 11.1934 16.944 11.4207L17.4547 11.97ZM8.0306 2.5459L8.57989 3.05657C8.80718 2.81209 8.84554 2.44682 8.67398 2.16046C8.50243 1.8741 8.16227 1.73559 7.83948 1.82066L8.0306 2.5459ZM12.9154 13.0035C9.64678 13.0035 6.99707 10.3538 6.99707 7.08524H5.49707C5.49707 11.1823 8.81835 14.5035 12.9154 14.5035V13.0035ZM16.944 11.4207C15.8869 12.4035 14.4721 13.0035 12.9154 13.0035V14.5035C14.8657 14.5035 16.6418 13.7499 17.9654 12.5193L16.944 11.4207ZM16.7295 11.7789C15.9437 14.7607 13.2277 16.9586 10.0003 16.9586V18.4586C13.9257 18.4586 17.2249 15.7853 18.1799 12.1611L16.7295 11.7789ZM10.0003 16.9586C6.15734 16.9586 3.04199 13.8433 3.04199 10.0003H1.54199C1.54199 14.6717 5.32892 18.4586 10.0003 18.4586V16.9586ZM3.04199 10.0003C3.04199 6.77289 5.23988 4.05695 8.22173 3.27114L7.83948 1.82066C4.21532 2.77574 1.54199 6.07486 1.54199 10.0003H3.04199ZM6.99707 7.08524C6.99707 5.52854 7.5971 4.11366 8.57989 3.05657L7.48132 2.03522C6.25073 3.35885 5.49707 5.13487 5.49707 7.08524H6.99707Z"

</header><main>
        <div class="p-4 mx-auto max-w-(--breakpoint-2xl) md:p-6">
          <div class="rounded-2xl border border-gray-200 bg-white p-6 dark:border-gray-800 dark:bg-white/[0.03]">
            <h3 class="mb-6 text-lg font-semibold text-gray-800 dark:text-white">キャラクター追加</h3>

            <div class="grid grid-cols-1 gap-4 md:grid-cols-2">
              <!-- 画像アップロード -->
              <div class="md:col-span-2">
                <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400">画像</label>
                <label
                  class="flex items-center gap-3 cursor-pointer rounded-lg border border-gray-200 px-4 py-2 text-sm text-gray-600 hover:bg-gray-50 dark:border-gray-800 dark:text-gray-400 dark:hover:bg-gray-800">
                  <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4" />
                    <polyline points="17 8 12 3 7 8" />
                    <line x1="12" y1="3" x2="12" y2="15" />
                  </svg>
                  <span x-text="form.image ? '画像を変更' : '画像を選択'"></span>
                  <input type="file" accept="image/*" class="hidden" @change="
        const file = $event.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (e) => form.image = e.target.result;
          reader.readAsDataURL(file);
        }
      " />
                </label>
              </div>
              <!-- name -->
              <div>
                <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400">ID（英語・スネークケース）</label>
                <input type="text" x-model="form.name"
                  class="w-full rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-800 dark:bg-gray-900 dark:text-white"
                  placeholder="mario" />
              </div>

              <!-- name_ja -->
              <div>
                <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400">名前（日本語）</label>
                <input type="text" x-model="form.name_ja"
                  class="w-full rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-800 dark:bg-gray-900 dark:text-white"
                  placeholder="マリオ" />
              </div>

              <!-- specialty -->
              <div>
                <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400">得意地形</label>
                <select x-model="form.specialty"
                  class="w-full rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-800 dark:bg-gray-900 dark:text-white">
                  <option value="">なし</option>
                  <option value="on_road">舗装路</option>
                  <option value="off_road">悪路</option>
                  <option value="water">水上</option>
                </select>
              </div>

              <!-- description -->
              <div class="md:col-span-2">
                <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400">説明</label>
                <textarea x-model="form.description" rows="3"
                  class="w-full rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-800 dark:bg-gray-900 dark:text-white"></textarea>
              </div>

              <!-- ステータス -->
              <template x-for="[key, label] in [
                ['on_road_speed', 'スピード（舗装路）'],
                ['off_road_speed', 'スピード（悪路）'],
                ['water_speed', 'スピード（水上）'],
                ['acceleration', '加速度'],
                ['mini_turbo', 'ミニターボの加速度'],
                ['weight', '重さ'],
                ['coin_curve', 'コイン増の加速度'],
                ['on_road_handling', 'まがりやすさ（舗装路）'],
                ['off_road_handling', 'まがりやすさ（悪路）'],
                ['water_handling', 'まがりやすさ（水上）'],
                ['invincibility', '無敵の時のスピード'],
              ]" :key="key">
                <div>
                  <label class="mb-1 block text-sm text-gray-600 dark:text-gray-400" x-text="label"></label>
                  <input type="number" min="0" max="13" x-model.number="form[key]"
                    class="w-full rounded-lg border border-gray-200 px-4 py-2 dark:border-gray-800 dark:bg-gray-900 dark:text-white" />
                </div>
              </template>
            </div>

            <!-- ボタン -->
            <div class="mt-6 flex gap-3">
              <button @click="save()" class="rounded-lg bg-brand-500 px-6 py-2 text-white hover:bg-brand-600">
                保存
              </button>
              <a href="index.html"
                class="rounded-lg border border-gray-200 px-6 py-2 text-gray-600 hover:bg-gray-50 dark:border-gray-800 dark:text-gray-400">
                キャンセル
              </a>
            </div>

          </div>
        </div>
      </main>
    </div>
  </div>
<script defer src="bundle.js"></script></body>

</html>
